name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    uses: mvslovers/mbt/.github/workflows/build3.yml@main
    with:
      host_tests: true          # also run mbt test

  # FTPD is AC(1).  Fetched from an APF-authorized library it is loaded into
  # key-0 storage, so a key-8 store into its own statics abends S0C4 before
  # the first WTO (#101).  The build cannot see that -- this can.
  module-data:
    name: No writable data in AC(1) modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check module data
        run: python3 tools/check-module-data.py

  # Who may see, read and delete which job on the spool is decided in one
  # place.  This fails when ftpd#jes.c gets a way around it: an owner compared
  # by hand, a RACF call outside the policy, or a job deleted or its data
  # connection opened before the policy ran (#90).
  jes-access:
    name: Every JES spool path goes through the policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check JES spool access
        run: python3 tools/check-jes-access.py
